name: Test

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        pytest-version: ["8.4.0", "9.0.0", "9.1.1"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      
      - name: Install pytest
        run: python -m pip install pytest==${{ matrix.pytest-version }}
      
      - name: Print pytest version
        run: pytest --version

      - name: Run tests
        run: pytest
