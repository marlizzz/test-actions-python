name: Test

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      
      - name: Install dependencies
        run: python -m pip install .
      
      - name: Run tests
        run: pytest
