name: Test

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: python -m pip install .
      
      - name: Run tests
        run: pytest
